<main>
    <section class="form-section">
        <img src="assets/svg/fireskull_logo.png" alt="skull logo" />
        <h2>{{title}}</h2>
        <ng-content></ng-content>
        <div class="btn-wrapper">
            <button class="btn-primary" 
            (click)="submit()"
            [disabled]="disablePrimaryBtn" 
            >
            {{primaryBtnText}}
        </button>
            <div class="divider" >
                <span>or</span>
            </div>
            <button class="btn-secondary" (click)="navigate()">{{secondaryBtnText}}</button>
        </div>     
    </section>
    <section class="main-section">
        <h1> Attitude on wheels </h1>
        <img src="assets/svg/skate.png" alt="Ilustração" />
    </section>
</main>
